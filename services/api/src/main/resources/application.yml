spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nba}
    username: ${DB_USER:nba}
    password: ${DB_PASSWORD:nbapass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/nba}

server:
  port: 8080
  servlet:
    context-path: /

recommender:
  base-url: ${RECOMMENDER_BASE_URL:http://localhost:8000}
  timeout-ms: ${RECOMMENDER_TIMEOUT_MS:1800}

keycloak:
  realm: ${KEYCLOAK_REALM:nba}
  admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
