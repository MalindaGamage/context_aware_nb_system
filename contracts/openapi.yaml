openapi: 3.0.3
info:
  title: NBA API
  version: 1.1.0
  description: Context-Aware Next Best Action API (Sprint 0/1 baseline)
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login via OAuth2 password grant (proxied to Keycloak in web app)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /secure/ping:
    get:
      summary: Dummy protected API for end-to-end auth validation
      responses:
        '200':
          description: Pong response
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /doctors:
    get:
      summary: Doctor directory with filtering + pagination
      parameters:
        - in: query
          name: tier
          schema:
            type: string
        - in: query
          name: specialty
          schema:
            type: string
        - in: query
          name: territoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        '200':
          description: Paged doctor result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDoctor'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /doctors/{id}:
    get:
      summary: Doctor detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '404':
          description: Doctor not found (or out of MR territory scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /doctors/nearby:
    get:
      summary: Nearby doctors from GPS coordinates
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: lon
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: radiusKm
          schema:
            type: number
            format: double
            default: 5
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Nearby doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
        '400':
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /territories:
    get:
      summary: Territory directory
      responses:
        '200':
          description: Territory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Territory'

  /users/mrs:
    get:
      summary: MR list with assigned territories summary
      responses:
        '200':
          description: MR list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'

  /users/me/territories:
    get:
      summary: Territories for current user
      responses:
        '200':
          description: Current user territory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Territory'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, path, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string

    Doctor:
      type: object
      required: [id, fullName, tier, priorityScore]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        specialty:
          type: string
          nullable: true
        tier:
          type: string
        priorityScore:
          type: integer
        territoryId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true

    PageDoctor:
      type: object
      required: [content, meta]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    Territory:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string

    UserSummary:
      type: object
      required: [id, fullName, email, territories]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        territories:
          type: array
          items:
            $ref: '#/components/schemas/Territory'
